# Individual subscriber configuration:
#   name:           Source name
#   topic:          The topic that provides ackermann_cmd messages
#   timeout:        Time in seconds without incoming messages to consider this topic inactive
#   priority:       Priority: an UNIQUE unsigned integer from 0 (lowest) to MAX_INT 
#   short_desc:     Short description (optional)

subscribers:
  - name:        "Nav_0"
    topic:       "input/nav_0"
    timeout:     0.2
    priority:    20
    short_desc:  "mission 8. parking mission"

  - name:        "Nav_1"
    topic:       "input/nav_1"
    timeout:     0.2
    priority:    18
    short_desc:  "mission 1. rubber cone mission"

  - name:        "Nav_2"
    topic:       "input/nav_2"
    timeout:     0.2
    priority:    15
    short_desc:  "mission 2. red road mission"

  - name:        "Nav_3"
    topic:       "input/nav_3"
    timeout:     0.2
    priority:    12
    short_desc:  "mission 5. barricade detector mission"

  - name:        "Nav_4"
    topic:       "input/nav_4"
    timeout:     0.2
    priority:    10
    short_desc:  "mission 3. crosswalk mission"

  - name:        "Nav_5"
    topic:       "input/nav_5"
