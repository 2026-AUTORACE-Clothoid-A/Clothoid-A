#!/usr/bin/env python
PACKAGE="usb_cam"
from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

gen.add("exposure",      int_t, 0, "camera exposure",        180,    1, 5000)
gen.add("brightness",    int_t, 0, "camera brightness",       3,  -64,   64)
gen.add("contrast",      int_t, 0, "camera contrast",        50,    0,   64)
gen.add("saturation",    int_t, 0, "camera saturation",      80,    0,  128)
gen.add("sharpness",     int_t, 0, "camera sharpness",        2,    0,    6)
gen.add("white_balance", int_t, 0, "camera white balance", 5200, 2800, 6500)

exit(gen.generate(PACKAGE, "usb_cam", "dynamic_camera_parameter"))
