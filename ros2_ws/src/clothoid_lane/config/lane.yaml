# Lane following parameters. Everything marked "retune" came from the 2025 car/camera
# (640x480 usb_cam, yellow lane) and must be re-tuned on the LIMO (DaBai DC1).
lane_main:
  ros__parameters:
    # 25 Hz copies from limo_base (topics.yaml imu_slow_topic): only the newest pitch / yaw / pose is
    # read per 30 Hz frame. 1113_auto_05: |frame - newest IMU stamp| p95 26 ms, max < 40 ms at 25 Hz,
    # so steering_lock_sync_tolerance 0.04 still holds. Old bags have no /imu_25hz: for a replay set
    # these back to /imu and /odom in a params file given last (tools/load_profile/run.sh)
    imu_topic: /imu_25hz
    odom_topic: /odom_25hz
    # 0.8 since 2026-11-08: the 02:27 / 02:55 drives at 0.8 (zigzag 0.2) did a lap in about 40 s with no
    # line crossing outside the A/B fork. The rule book recommends 0.3~0.4 m/s: check it before the
    # competition. With another speed, scale steer_gain inversely (see below).
    base_speed: 0.8
    # mission 6 slow guide lines (zigzag, track2026 only): rules say pass slowly holding the heading
    zigzag_speed: 0.2          # m/s while the zigzag is seen; 0 = no change
    zigzag_hold_sec: 0.5       # bags: the zone state drops for 0.2 s at most inside the zone
    lost_hold_sec: 0.0         # >0 keeps the last heading when the lane is lost
    # Only during a fresh bump approach, bridge a near-straight lane occlusion.
    # Either distance or time ends the continuation, even if the car is stuck.
    bump_gap_speed: 0.2
    # Archive bump: 0.50 m long + 0.20 m wheelbase + 0.10 m allowance.
    # Continue the existing gap only; no new stop state or early sign trigger.
    bump_gap_max_distance: 0.8  # m of wheel odometry since the last measured lane
    bump_gap_max_duration: 4.0 # s since that lane frame
    bump_gap_max_steer_deg: 5.0 # straight-boundary eligibility and yaw correction limit
    bump_gap_max_yaw_error_deg: 8.0
    bump_gap_max_lateral_error: 0.1 # m from the last measured straight heading
    bump_gap_yaw_gain: 1.5
    steering_lock_timeout: 1.5 # seconds since mission heartbeat; prevents a stale lock persisting
    steering_lock_level_deg: 1.2 # cache steering while level, before the camera tilts
    steering_lock_reference_timeout: 1.0
    steering_lock_imu_timeout: 0.25
    steering_lock_sync_tolerance: 0.04 # camera/IMU sensor-stamp difference when caching level steering
    # the steered-to target moves at most this many warped px per frame (0 = off); see lane_main.py
    target_max_step_px: 8.0
    # Cone exit: cap speed until consecutive detections and the control target agree.
    cone_exit_speed: 0.3
    # multiplies the 2025 steering law. The turn rate for a steering angle grows with the speed, so keep
    # speed x steer_gain about the same: 0.8 m/s x 0.33 = 0.26 drove best (2026-11-08 02:27 / 02:55:
    # 0-4 jumps over 8 deg per minute, straight steering sd 1.5-2.2 deg); 0.8 x 0.55 weaved (23:53, 71
    # jumps per minute); the dawn lap was 0.3 x 1.0. E.g. 0.6 m/s -> about 0.45, 0.4 m/s -> 0.65.
    # The cone section steers with its own pure pursuit (cone_follower), not with this.
    steer_gain: 0.33
    # below base_speed (stop line approach, slow sign, zigzag) the gain rises as base_speed / speed so
    # speed x gain stays at 0.26, at most steer_gain_max (the 0.3 m/s dawn lap drove with 1.0). Without
    # it the 0.2 m/s stop line approach in a corner turned a quarter of what it needed (2026-11-09).
    steer_gain_speed_scaling: true
    steer_gain_max: 1.0
    # left boundary first (2026-11-08): in right corners the inner (right) line leaves the view and the
    # target jumped to the left line; following the left (outer) line cut the boundary switches about
    # 3x in the bags. On two-lane parts the left boundary is the dashed divider.
    initial_side: 0            # 0 left lane, 1 right lane, 2 both
    # lane width, line centre to centre in metres: 0.5 m on our track (measured 2026-11-07). The rule
    # v3 book specifies 500 mm. In the warped image it
    # is lane_width_m x warp_px_per_m (per car, camera_*.yaml): 0.5 m = 170 px.
    lane_width_m: 0.5
    parking_lane_width_m: 0.68   # was 231 px (2025's 140 px scaled with the lane width), retune

    # warp: per car, see camera_limo1.yaml / camera_limo2.yaml (launch argument camera:=)

    # detector: track2026 (yellow outer lines + white dividers, lane_tracker.py) or sliding2025 (2025 port)
    detector: track2026

    # Current-image color pipeline; gamma/CLAHE run before blur and BEV.
    # HSV without preprocessing preserves the existing behavior. See color_*.yaml presets.
    color_method: hsv       # hsv | lab | rgb (track2026)
    gamma_enabled: false
    gamma: 1.2              # output = round(255 * (input / 255)^gamma); >1 darkens
    clahe_enabled: false
    clahe_clip_limit: 2.0   # 8-bit Lab L only
    clahe_grid_size: 8
    lab_yellow_b_min: 2.0   # float CIELab: L 0..100, signed a/b
    lab_yellow_a_abs_max: 25.0
    lab_yellow_l_min: 40.0
    lab_white_chroma_max: 16.0
    lab_white_l_min: 80.0
    rgb_yellow_difference_min: 5   # min(R,G) - B, 0..255 channels
    rgb_yellow_v_min: 90
    rgb_white_spread_max: 30      # max(R,G,B) - min(R,G,B)
    rgb_white_v_min: 190

    # yellow lane line (HSV). Measured on the 11-05 bags: tape H 18~28, S 70~180, V 100~220,
    # floor S 0~35, V 35~65. The 2025 value S >= 215 matched no tape at all.
    hsv_lower: [18, 60, 90]
    hsv_upper: [35, 255, 255]
    canny_low: 50            # sliding2025 only
    canny_high: 100          # sliding2025 only

    # track2026: white lane dividers between the yellow lines (warped image px)
    white_h_min: 0           # inclusive 0..179; full range keeps the previous white mask
    white_h_max: 179
    white_s_max: 50          # white = S <= 50 and V >= 170
    white_v_min: 170
    # white_min_length (divider dash >= this many px) depends on the warp: camera_limo1.yaml / camera_limo2.yaml
    white_max_width: 14.0    # divider 8 px; crosswalk bars 25+, diamond 38+
    white_max_angle_deg: 25.0  # from the nearest yellow line; stop lines are ~90
    white_offset_tol: 0.3    # divider at 0.7~1.3 lane widths from the nearest yellow line
    # look_row (target row) is per car, in camera_limo1.yaml / camera_limo2.yaml. Do not set it here:
    # under `lane_main:` it would win over the `/**` camera file when started from a launch file.

    # debug (default false) is set by the launch argument `debug:=true`: true publishes /lane/debug_image
