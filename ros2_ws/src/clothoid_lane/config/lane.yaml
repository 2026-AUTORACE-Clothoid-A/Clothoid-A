# Lane following parameters. Everything marked "retune" came from the 2025 car/camera
# (640x480 usb_cam, yellow lane) and must be re-tuned on the LIMO (DaBai DC1).
lane_main:
  ros__parameters:
    base_speed: 0.3            # rules recommend 0.3~0.4 m/s
    lost_hold_sec: 0.0         # >0 keeps the last heading when the lane is lost
    initial_side: 1            # 0 left lane, 1 right lane, 2 both
    lane_width: 170            # px in the warped image, measured with the warp below
    parking_lane_width: 231    # px, 140 scaled with lane_width from 103 (retune)

    # warp: perspective corners, set on limo1 from straight-lane frames, camera lens 18.7~19 cm
    # above the floor. Redo if the camera mounting changes.
    warp_x_h: -28
    warp_x_l: 370
    warp_y_h: 70
    warp_y_l: 40

    # lane color mask (HSV) and Canny
    # yellow tape on the 2026-11-04 practice track: H 22~26, S 90~180, V 125~215 (1105 bag analysis).
    # The 2025 range [20, 215, 0]~[40, 255, 255] matched 0 pixels on this track.
    hsv_lower: [18, 70, 100]
    hsv_upper: [32, 255, 255]
    canny_low: 50
    canny_high: 100
    # with at least this many yellow pixels in the warped view, keep only yellow and the Canny
    # edges within yellow_near_px of it (drops white text, diamonds, crosswalks, cone outlines).
    # Below it (white-lane sections) use Canny OR HSV as in 2025. 0 = always the 2025 mask.
    yellow_min_pixels: 150
    yellow_near_px: 4
    # yellow blobs thicker than this (px, camera image, inside the warp band) are cones and are removed
    # with their outline. 1105 bags: lane tape, corners and zigzag 10~41 px, yellow cones 52~113 px.
    # 0 = keep every blob.
    yellow_max_thickness: 46

    # debug (default false) is set by the launch argument `debug:=true`: true publishes /lane/debug_image
