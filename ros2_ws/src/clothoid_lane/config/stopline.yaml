# Stop line node: one white stop line right in front (bottom of the bird's-eye view) ->
# /stopline_near. The 2025 crosswalk stripe detector (/stopline_detected) is no longer run.
# Floats need a decimal point.
stopline:
  ros__parameters:
    # warp: per car, see camera_limo1.yaml / camera_limo2.yaml (launch argument camera:=)
    hsv_lower: [0, 0, 150]
    hsv_upper: [180, 60, 255]
    gray_low: 130
    near_frames: 2             # consecutive frames before /stopline_near goes true
    # debug (default false) is set by the launch argument `debug:=true`: true publishes
    # /stopline/debug_image (the judged window as a white mask)
