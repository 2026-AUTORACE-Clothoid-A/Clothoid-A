# T-parking 2026: lidar finds the empty bay between two parked LIMOs, one forward full-lock
# arc in (rear-axle radius 0.46 m, limo2 floor sweep 2026-11-08), stop at the bay centre.
# Every plan.* / bay.* field of planner.PlanParams / bay_finder.BayParams can be set here.
parking:
  ros__parameters:
    imu_topic: /imu
    odom_topic: /odom
    state_topic: /parking/state
    rate_hz: 20.0
    wheelbase: 0.2
    laser_x: 0.103             # laser_link ahead of base_link (URDF)
    lazy_sensors: true         # imu/odom/scan only from /parking_flag until DONE (false: always)
    arm_wait_sec: 1.0          # after the flag, wait this long for all three before refusing
    # Preparation subscribes only scan and never commands the vehicle.
    probe.rate_hz: 5.0
    probe.confirm_scans: 3
    probe.max_gap: 0.75
    probe.tolerance: 0.08

    # Experimental registered six-bay search. False selects the legacy lidar gap finder.
    layout.enabled: true
    layout.control_enabled: true   # user-enabled registered target control (lane-side middle bay)
    layout.target_bay: 2           # designated lane-side middle bay
    layout.observation_stop_margin: 0.08 # stop before turn if goal remains unobserved
    layout.scan_hz: 5.0
    layout.columns: 3
    layout.rows: 2
    layout.bay_width: 0.50
    layout.bay_depth: 0.60
    layout.line_width: 0.02
    layout.position_tolerance: 0.07
    layout.confirm_frames: 3
    layout.confirm_scans: 3
    layout.evidence_age: 1.5

    # Lane speed cap only after repeated visual registration + lidar support.
    approach.enabled: true
    approach.speed: 0.20
    approach.deceleration: 0.5
    approach.reaction_sec: 0.25
    approach.stop_margin: 0.08
    approach.hold_sec: 3.0
    approach.timeout_sec: 15.0

    plan.side: -1.0            # bays on the right
    # limo2, fitted to 5 parking bags against the lidar (2026-11-09): rear slides at full lock.
    # Simulator: -p plan.rear_offset:=0.0 -p plan.odom_scale:=0.985 -p plan.turn_radius:=0.46
    plan.rear_offset: 0.02
    plan.odom_scale: 0.98
    plan.turn_radius: 0.45
    plan.search_speed: 0.2
    plan.turn_speed: 0.2
    plan.enter_speed: 0.1
    plan.turn_lead: 0.03       # m earlier: wheels take ~0.2 s to reach lock (retune on the floor)
    plan.turn_early_deg: 6.0   # 3.0 ended 3-4 deg over-rotated on limo2 (2026-11-09)
    plan.max_search: 3.0       # m without a bay -> stop (ABORT)
    plan.park_hold_sec: 3.0    # s standing in the bay, then back out the way it came in
    plan.exit_enabled: true    # false: stay parked, /parking_done right after park_hold_sec
    plan.exit_speed: 0.15
    plan.exit_early_deg: 2.0

    bay.near: 0.15             # lateral band where the parked cars' near ends are
    bay.far: 0.80
    bay.face_to_centre: 0.161  # half a LIMO (322 mm)

    # debug (default false) is set by the launch argument `debug:=true`
