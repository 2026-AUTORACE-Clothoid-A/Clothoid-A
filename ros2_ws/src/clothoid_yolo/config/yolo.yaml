# YOLO node. No model exists yet: `backend: none` keeps the node running and publishing empty
# DetectionArray messages. Switch to ultralytics and set model_path when a model is trained.
# Never write an empty list in a ROS2 yaml: use [''] as below.
yolo:
  ros__parameters:
    # backend (default none) and model_path (default '') come from launch: backend:=ultralytics model_path:=/path/model.pt
    # (a launch argument cannot override a key that is also written here)
    imgsz: 640
    device: ''               # '' = auto, 'cuda:0', 'cpu'
    model_conf: 0.25         # threshold inside the model
    min_confidence: 0.5      # threshold for what is published
    # image_source: 10hz     # 10hz: /camera/color/image_10hz every frame; raw: /camera/color/image_raw every image_every-th
    image_every: 3           # used when image_source=raw (3 on 30 Hz camera -> ~10 Hz)
    # rename model classes to Detection.msg names, e.g. ['red:traffic_light_red']
    class_aliases: ['']
    # debug (default false): `ros2 param set /yolo debug true` publishes /yolo/debug_image
