# Mission state logic, first draft from the 2026 rules summary. Values marked "rules" come from
# the rule book, the rest are guesses to retune on the track. Floats need a decimal point.
mission:
  ros__parameters:
    rate_hz: 20.0
    # 25 Hz copies from limo_base (topics.yaml imu_slow_topic): the bump logic reads the newest pitch
    # once per 20 Hz tick, the line stop only the odom distance. Old bags: back to /imu, /odom
    imu_topic: /imu_25hz
    odom_topic: /odom_25hz
    sign_log: armed             # all | armed | off: IGNORED lines wrote tens of lines a second (1119)
    input_timeout: 0.5          # detections / stop line / imu older than this count as "not seen"
    refresh_sec: 1.0            # direction / parking / steering_lock flag re-sent this often
    # Per-class proximity gates run before object tracking and frame confirmation.
    # Values need field calibration for the actual camera and sign dimensions.
    light_max_offset_height_ratio: 3.5
    sign_max_offset_height_ratio: 5.0
    fork_max_offset_height_ratio: 13.0
    # The valid roadside bump warning is far off centre in this camera.
    bump_max_offset_height_ratio: 0.0 # <=0 disables only the bump lateral gate
    bump_min_area: 0.0
    bump_min_height: 24.0      # prepare before the bump's start stop line
    slow_min_area: 0.0
    slow_min_height: 28.0      # prepare before the slow zone's start stop line
    parking_min_area: 0.0
    parking_min_height: 28.0   # prepare before entry/bay handover; retain source quality checks
    pedestrian_min_area: 0.0
    pedestrian_min_height: 28.0 # 2500 px^2 plus lateral gate rejected the valid warning in the bag
    # Confirm on distinct source images; colours share a traffic-light identity.
    detection_confirm_hits: 3
    # Fork signs (sign_left / sign_right) confirm on 2 frames within fork_confirm_age: small (~20 px)
    # and seen between the static obstacles (1114: never confirmed with 3, the car took the default road).
    # 1115_1709: a 2nd frame did not come within 0.5 s at YOLO 10 Hz, and a conf 0.85 box touching
    # the left border was dropped as 'edge'; no other fork sign is around, so a cut box still tells
    # the side.
    fork_confirm_hits: 2
    fork_confirm_age: 1.0       # s (other classes: detection_max_age)
    fork_ignore_edge: true      # fork boxes on the image border count (other classes: detection_edge_margin)
    # 1115_1726: sign_left 0.65 / 0.59 / 0.55 at 17:27:18, 2.3 m before the island; confirmed only
    # 0.74 m before it, the swerve back crossed the island tip. YOLO min_confidence is 0.5
    fork_confidence: 0.55       # sign_left / sign_right (other classes: detection_confidence)
    # While the car swerves the fork sign sweeps across the image (1115_1726: centre x 469 -> 362 -> 283
    # every 0.4-0.5 s, box ~20 px wide), so the 'same place' check never matched two frames. Only one
    # fork sign is around: match any x (y and size still). Bags 0248 / 0253 / 1726: confirmed 8 / 36 /
    # 8 s earlier, same side, all inside /avoid/active
    fork_any_x: true
    detection_window: 5
    detection_max_age: 0.5
    detection_confidence: 0.6
    sign_min_height: 14
    light_min_height: 8
    detection_edge_margin: 2
    # Candidate-only parking/pedestrian tracks; scene evidence still gates action.
    scene_sign_candidates: true
    track_retention_sec: 2.0    # selected red light is retained through occlusion until release
    track_max_objects: 32      # bounded history and association work
    track_match_gate: 1.0      # centre displacement in object-size units
    track_scale_ratio: 3.0     # symmetric size-change association limit
    require_scene_confirmation: true  # local entry/bay evidence still required after the cone gate
    parking_enabled: true      # full.launch overrides with use_parking; no idle P processing when off
    parking_scene_rate_hz: 6.0 # decode/warp cap while only preparing parking; stops use camera rate
    parking_entry_max_travel: 3.0 # entry evidence expires after this measured travel past the line
    parking_entry_reaction_sec: 0.20 # reaction and command delay before parking entry braking
    parking_entry_deceleration: 1.0 # m/s^2 for the gradual parking entry speed limit
    # Stop-line corridor and physical thickness, in metres on the ground.
    line_band: 0.22
    line_min_run: 0.7
    line_min_thickness: 0.008
    line_max_gap: 0.01          # m, bridge the floor mats' seam across the stop line (1118 night: 0.3~0.6 cm)
    line_max_thickness: 0.12
    line_max_frame_gap: 0.25
    line_require_crosswalk: true  # pedestrian/light line must lead into white longitudinal bars
    line_crosswalk_grace: 0.35    # s, pedestrian / light stop: bars seen just past the line within this still confirm
                                  # it (1118 1607: blue light, line at 0.81~0.73 m, bars only in the next image)
    front_axle_x: 0.10          # mission entry only: base_link -> front wheels
    entry_reaction_sec: 0.10    # timer/actuation lead; 0738/0816 bags reach 0.2 in 0.20-0.24 s
    entry_deceleration: 2.5     # m/s^2; 0.8 -> 0.2 starts about 0.24 m before entry, including 4 cm margin
    entry_confirm_frames: 2    # distinct, odometry-consistent images of the mission START line
    entry_min_span: 0.26       # metres across the road; partial boundary while leaving a corner
    entry_rate_hz: 10.0        # shared image/mask, entry fit at most once per 100 ms time slot
    slow_speed: 0.2             # rules: 0.2 m/s or less
    slow_hold_sec: 5.0          # s after the last confirmed slow sign (1118: 4 s ended before the hill)
    slow_until_pedestrian_stop: true  # zigzag zone: a pedestrian sign in the slow hold keeps it to that stop
    # speed bump (IMU Pitch + YOLO fusion)
    bump_pitch_thresh: 3.5      # deg, absolute pitch; supports either IMU sign convention
    bump_level_thresh: 1.2      # deg, abs angle to detect vehicle leveled
    bump_level_duration: 0.3    # sec, leveling after opposite tilt (rear axle) confirms exit
    bump_arm_timeout: 12.0      # sec since last confirmed sign; 6 s expired before contact in sim
    bump_cooldown: 4.0          # sec, cooldown before re-arming bump
    # 1118 PM: the start's bump sign became a slow sign, whose 4 s hold ended before the hill. The IMU
    # alone now slows over any tilt >= bump_pitch_thresh (speed only, lane keeps steering) until level
    # after the opposite tilt, at most hill_max_sec after the last tilt
    hill_slow_imu: true
    hill_max_sec: 6.0
    # first slow zone (start hill): lane_main holds the IMU yaw from the first slow sign until the hill is
    # over (hill imu rose and fell), at most yaw_hold_max_sec; the hill's yellow paint pulled the target
    first_slow_yaw_hold: true
    yaw_hold_max_sec: 10.0
    yaw_hold_after_m: 1.0       # m after the first slow sign: steady heading until just before the hill
    # Main route policy: sustained cone entry unlocks parking and blocks later bump signs.
    require_cone_for_parking: true
    block_bump_after_cone: true
    avoid_release_hold: 2.0     # s: ignore cone_active during avoidance and this long after
    cone_confirm_sec: 1.5
    slow_arms_bump: false      # round slow warning uses slow_hold_sec, independent of bump traversal
    # missions
    pedestrian_wait_sec: 3.5    # rules: 3 s or more, restart within 15 s
    stop_on_yellow: true        # rules say nothing about yellow
    arm_timeout_sec: 8.0
    cooldown_sec: 15.0
    fork_left_direction: 0      # lane_main side: 0 left lane, 1 right lane, 2 both
    fork_right_direction: 1
    fork_lock_after_avoid: true # keep the direction once static_avoid ran and ended (later boxes: misdetections)
    # Only used when require_scene_confirmation is explicitly disabled (legacy mode).
    parking_at_stopline: true
    # Legacy parameter names: these refer to mission START lines, not crosswalk stop lines.
    # Signs prepare the entry observer; braking begins before front-wheel entry.
    slow_at_stopline: false     # 1118 PM: slow at once on the confirmed sign (the zone start lines were missed)
    bump_at_stopline: true
    # light / pedestrian stop line: clothoid_finish's FinishCore with the cross line in white
    # (line_stop.py), independently of mission entry. Keep FinishCore's original stop settings.
    # Mission entry starts approach slowing with its own braking lead; the final stop stays separate.
    use_stop_line: true         # false: 2025 behaviour, stop the moment /stopline_detected is true
    approach_speed: 0.2         # target speed at the parking entry line; also the line stop fallback
    image_topic: /camera/color/image_raw   # raw over shm: a compressed subscriber makes the camera driver JPEG-encode every frame
    compressed: false
    white_h_min: 0              # inclusive 0..179; full range keeps the previous white mask
    white_h_max: 179
    white_s_max: 60             # stop line white: S <= 60, V >= 150
    white_v_min: 150
    # Independent from lane_main. Mission classifies white without subtracting lane yellow.
    color_method: hsv
    gamma_enabled: false
    gamma: 1.2
    clahe_enabled: false
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    lab_yellow_b_min: 2.0
    lab_yellow_a_abs_max: 25.0
    lab_yellow_l_min: 40.0
    lab_white_chroma_max: 16.0
    lab_white_l_min: 80.0
    rgb_yellow_difference_min: 5
    rgb_yellow_v_min: 90
    rgb_white_spread_max: 30
    rgb_white_v_min: 190
