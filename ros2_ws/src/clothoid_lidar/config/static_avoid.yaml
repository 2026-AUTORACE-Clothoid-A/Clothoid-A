# Static obstacle mission (3-lane section). Design: docs/STATIC_AVOID.md. Distances in m.
# Floats need a decimal point. Topic names come from clothoid_bringup/config/topics.yaml.
static_avoid:
  ros__parameters:
    cmd_topic: /cmd_vel_avoid
    # limo_base's 25 Hz copies (topics.yaml imu_slow_topic / odom_slow_topic): only the yaw and the
    # driven distance are used, interpolated. Taking /imu 100 Hz + /odom 50 Hz cost this node about
    # half of its CPU on the car (PC bag replay: 7~9 % + 6 % of a core for empty callbacks); on 10
    # bags the starts, hand-overs and lanes stay the same at 25 Hz (within 2 cm / 0.1 s). Old bags and
    # the simulator have no 25 Hz topics: set these back to /imu and /odom in a params file given last
    # (simul_batch.py does)
    imu_topic: /imu_25hz
    odom_topic: /odom_25hz
    limos_topic: /lidar/limos
    # camera red share as a 'cone course' sign: OFF. The cone mission (namgyu/cone) starts on the lidar
    # alone, so only /cone/mission_active is used. To try it: use_red_ratio true and start red_ratio.
    use_red_ratio: false
    red_ratio_max: 0.10          # 1105 bags: obstacle zone <= 0.06, cone course >= 0.20
    debug: true                  # /avoid/path, /avoid/cues
    # debug_heavy: false           # + /avoid/candidates, /avoid/costmap: slow on the Jetson, rviz only   (launch argument; a value here would override it)
    # recovery_reverse: true       # every path blocked for 1.5 s: back up 0.2 m along the way the car came (launch argument reverse)   (launch argument; a value here would override it)
    load_log_period: 0.0         # s, a log line with each callback's run time; 0 = off (load is measured with tools/carmon, 2026-11-16)

    lane_width: 0.50             # line centre to centre on our track; rules 0.55, check at the venue
    # trigger
    activate_range: 1.5
    block_half_width: 0.30
    activate_scans: 3
    rearm_clear: 1.0             # s
    # hand-over to lane_main
    min_travel: 3.0
    max_travel: 7.0
    release_tol: 0.10
    release_heading_deg: 10.0
    release_clear: 2.0          # m ahead, all lanes clear
    # hand over beside the island in lane 1 / 3, handover_past m past its front (lane_main starts on
    # the A / B road; before the island it turned for lane 2 into the island, 1112 auto 05).
    # false: the hand-overs before the island (target lane, island close, a clear road)
    handover_after_island: true
    handover_past: 0.6
    handover_heading_deg: 15.0
    handover_overshoot: 0.6      # m further: hand over whatever the heading
    one_section_per_run: true    # after that hand-over no new start (restart the node for another run)
    # every path blocked for stuck_time: one search of curvature-limited three-arc paths (escape_*),
    # the best free one driven slowly to its end (1113 auto 05: 14 s stopped where only a quick
    # swerve went through)
    # on with the back-up (launch arguments escape / reverse, full.launch avoid_escape / avoid_reverse):
    # after a back-up along the way the car came, an escape path first. Not the 11-13 crash: that car
    # (1113 auto 01 / 02) was driven by cone_follower publishing on /cmd_vel_avoid (own /cmd_vel_cone
    # since 11-13 17:54); no back-up or escape command of static_avoid is in those bags
    # escape: true                 # (launch argument; a value here would override it)
    escape_margin: 0.0           # m of clearance more (+) / less (-) than safety for an escape path
    # swerve distance margin (AvoidParams.swerve_margin). This file's escape_margin 0.03 used to set it
    # too (one name for two values): 0.475 m on the car, 0.595 m everywhere it was tested
    swerve_margin: 0.15
    outside_margin: 0.10         # m past the yellow lines: hits dropped once the lanes are measured
    # painted island. Fallback when the entry line was not seen, from the point the mission started:
    # a start just before the entry line (1108 run 1 2 3 10 11) has the front at 4.61~4.74 m. A start
    # far past the line (run 6~9, first obstacle at 3 m) has it at 2.7 m and gets this wrong.
    island_s_min: 4.65
    island_s_max: 6.40
    fork_commit: 2.0
    # the island from the white entry line (rule book p.4 drawing at scale); the camera sees the
    # line, the base crosses it, a start within entry_max_back of that anchors the section
    island_from_entry_min: 4.40
    island_from_entry_max: 6.15
    entry_max_back: 3.0
    # course_map (launch argument course_map / full.launch avoid_course_map): the section start line by
    # its place on the /imu + /odom course map from the race start
    start_line_x: 8.25
    start_line_y: -4.65
    start_line_radius: 1.0
    start_line_heading_deg: 180.0
    start_line_heading_tol_deg: 35.0
    # heading snapped to the track axes on straights (not while avoiding); fallback to the lane-line pair
    course_straight: 1.5
    course_straight_spread_deg: 6.0
    course_snap_max_deg: 15.0
    course_fallback_past: 1.0
    start_line_odometer: 14.2
    course_fallback_odometer: 3.0
    # where the node started, from the first turn (AvoidParams.course_turn_deg): the race start ->
    # the mission starts on the start line (approach_speed until the first blocker); elsewhere -> a
    # blocker starts it anywhere; not judged yet -> no start
    course_turn_deg: 45.0
    course_corner_tol_deg: 20.0
    course_corner1_x_min: 7.5
    course_corner1_odometer_max: 11.0
    course_test_start: 1.0       # a LIMO in our lane this soon after the launch: an avoid test, elsewhere
    approach_speed: 0.8
    island_handover: 1.0         # handover_after_island false: m before the island front, lane_main enters A / B
    island_topic: ''             # PointStamped (base_link) island front from the lane side, if any
    # image_source: 10hz           # 10hz: image_10hz_topic, every frame; raw: image_topic, every image_every-th   (launch argument; a value here would override it)
    image_every: 3               # raw only: every 3rd camera frame
    # camera geometry and the paint colours are NOT set here: avoid.launch.py passes the lane
    # package's camera_<car>.yaml and lane.yaml lane_main white_s_max / white_v_min / hsv_*
    # control
    speed: 0.30
    slow_speed: 0.20
    lookahead: 0.45
    max_steer: 0.49
    # sign look (AvoidParams.sign_look): direction unknown, island front more than look_end ahead,
    # lane 1 / 3, own lane clear to the island -> heading so the fork sign is in view. The
    # lane beside the island fixes A / B: 3 of 7 hand-overs there were 'no sign' with the sign in place
    sign_look: true
    look_end: 0.4                # 0.6 ended the 1115_1709 look with the sign at the image edge
    look_view_deg: 10.0          # turn only until the sign is this close to the camera axis (1113: read up to ~20 deg)
    look_max_deg: 45.0
    look_exit_clear: 0.02        # turn into lane 2 only while the car can still get out of the island's width (+ this) ...
    look_exit_margin: 0.15       # ... look_exit_margin m before the island front; unread there -> back out to its own lane
    look_speed: 0.15             # while the look steers (sign out of view); in view the plan drives
    look_gain: 1.5
    # turn on the spot when the forward turn would not fit before look_end: forward / back at full
    # lock, each arc checked first; at most 2 cycles and 0.4 m back
    look_reverse: true
    look_turn_radius: 0.50       # car 7 turns at 0.455 / 0.48 m (full lock, ODOM_STEERING_TEST.md)
    look_step: 0.15
    look_reverse_speed: 0.10
    look_cycles_max: 2
    look_reverse_max: 0.40
