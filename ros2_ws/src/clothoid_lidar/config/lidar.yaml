# Rubber cone course (2025 rubber_cone / cone_sorter_node launch values) and the obstacle
# extractor that replaces obstacle_detector. Retune on the LIMO: smaller body, +-110 deg
# lidar, new cone spacing. Float parameters need a decimal point (0.4, not 0).
obstacle_extractor:
  ros__parameters:
    target_frame: base_link
    use_tf: true             # false = use lidar_x / lidar_y / lidar_yaw below
    lidar_x: 0.0
    lidar_y: 0.0
    lidar_yaw: 0.0
    range_min: 0.1
    range_max: 2.0
    angle_min_deg: -110.0
    angle_max_deg: 110.0
    cluster_gap: 0.06        # 0.08 merged neighbouring cones into one too wide to accept (docs: LIDAR_EXTRACTOR_EVAL)
    min_points: 2
    max_width: 0.15
    cone_radius: 0.04

cone_sorter:
  ros__parameters:
    trace_method: dfs2025    # dfs2025 (search with costs, 2025 launch values) or greedy
    # dfs2025 on the 11-03 and 11-05 bags: 0.4 keeps every target between the rows, 0.5 put 4~6
    # targets outside on cone1/cone2 and 0.6 bridged to the other row
    max_dist_between_cones: 0.4
    max_trace_length: 20
    threshold_directional_angle_deg: 45.0
    first_step_angle_deg: 90.0   # match main's cone classification and tracing
    angle_from_left_first_cone: 45.0
    dist_from_left_first_cone: 0.7
    dist_from_right_first_cone: 0.7
    # course start zone
    start_x_min: 0.0
    start_x_max: 1.3
    start_y_min: -0.6
    start_y_max: 0.6
    start_min_count: 6
    # course continue zone
    ing_x_min: 0.0
    ing_x_max: 1.0
    ing_y_min: -1.0
    ing_y_max: 1.0
    ing_min_count: 4
    # no course START while /avoid/active (static_avoid) is true: LIMOs side by side pass the start
    # test (1112/1113 avoid runs: 1~8 starts each, 1114_0028 aborted the avoidance). An older message
    # than this is ignored, so without static_avoid the course starts as before.
    avoid_active_timeout: 0.5
    # and this long after it ends (11-09 bags: an end among the LIMOs started the course 0~0.14 s
    # later; 2 s holds all three, the later starts at 4.2 s and more stay)
    avoid_release_hold: 2.0

cone_follower:
  ros__parameters:
    # Local memory pose: integrate rear-axle wheel speed with the IMU gyro.
    # The steering-feedback-derived /odom pose under-reports full-lock rotation.
    odom_topic: /odom
    imu_topic: /imu
    pose_topic: /cone/odom   # diagnostic local base_link pose; no global TF is replaced
    speed: 0.4                # normal course: unchanged main value and pursuit law
    reverse_speed: -0.2       # normal course: main's one-boundary reverse behaviour
    reverse_steer_deg: 21.0  # steering while backing off with one boundary only (2025 max_steer_deg)
    wheelbase: 0.2           # LIMO URDF / driver; 2025's single vehicle_length (0.25) is gone
    rear_axle_x: 0.1         # rear axle behind base_link (base_link is midway between the axles)
    lfd: 0.4                  # normal course: main's arc-length lookahead
    centerline_ds: 0.05
    lsq_window_size: 9
    boundary_timeout: 0.25   # 2025 used 0.1 = one scan period of the 10 Hz Tmini Plus
    # Exit retains the previous controller's independent rear-axle circle and speed.
    exit_speed: 0.25
    exit_lfd: 0.35
    exit_clearance: 0.2      # minimum path distance to current detected obstacle centres
    # After rear-axle arrival, connect to fresh detected lane commands under cone
    # priority. Limits apply equally to straight, left and right exits; no exit
    # waypoint / timed turn. Completion requires measured speed + IMU turn agreement.
    exit_connect_speed: 0.2
    exit_connect_steer_rate_deg_s: 20.0
    exit_connect_confirm_sec: 0.3
    exit_connect_max_distance: 1.0 # abort bound, never an arrival / release condition
    exit_connect_max_duration: 6.0 # abort bound, never an arrival / release condition

# Second extractor instance for the static obstacle mission: LIMO-sized objects, no cones
# (from namgyu/static-obstacle-avoidance). Retune min_width / min_points with a real LIMO scan.
limo_extractor:
  ros__parameters:
    obstacles_topic: /lidar/limos
    target_frame: base_link
    use_tf: true
    range_min: 0.1
    range_max: 2.0
    angle_min_deg: -110.0
    angle_max_deg: 110.0
    cluster_gap: 0.08
    min_points: 3
    min_width: 0.12          # LIMO body 0.22 m wide; cones (~0.07) are dropped
    max_width: 0.45
    cone_radius: 0.1         # centre = surface centroid pushed back by this

# Camera red/orange share for the cone course check (/camera/red_ratio, Float32 0..1).
# HSV: flat list, 6 numbers per range (h_lo, s_lo, v_lo, h_hi, s_hi, v_hi), OR-ed. Integers.
# 1105 bags (full frame, 2025 red): cone course 20-39 %, obstacle zone (cone stand-ins) <= 6 %,
# start threshold candidate 0.10 (0.07-0.15 all worked). NOT final: competition cone colour and
# camera white balance are unknown. The threshold belongs to the consumer (cone course start).
red_ratio:
  ros__parameters:
    image_topic: /camera/color/image_raw
    output_topic: /camera/red_ratio
    every_n: 3
    hsv_ranges: [0, 100, 100, 10, 255, 255, 170, 100, 0, 180, 255, 255]
    width: 160
    roi_top: 0.0
    roi_bottom: 1.0
